<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integration Directory</title>
  <link rel="stylesheet" href="directory-grid.css">
  <style>
    :root { --accent-color: #2563eb; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; background: #f9fafb; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    h4 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { line-height: 1.6; color: #4b5563; }
    a { color: inherit; }
    .btn.outline {
      background: transparent;
      border: 2px solid var(--accent-color);
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn.outline:hover { background: var(--accent-color); color: #fff; }

    /* Header */
    .site-header {
      background: var(--accent-color);
      color: #fff;
      padding: 2rem 0;
    }
    .site-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.375rem; }
    .site-header p { color: rgba(255,255,255,0.8); font-size: 0.9rem; line-height: 1.5; max-width: 560px; }

    /* Detected region pill */
    .geo-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #fff;
      margin-top: 0.875rem;
    }
    .geo-pill .geo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.875rem 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .stats-bar strong { color: #111827; }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.4rem 0.875rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      color: #374151;
      transition: all 0.15s;
    }
    .share-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
    .share-btn.copied { border-color: #16a34a; color: #16a34a; background: #f0fdf4; }

    /* Card badges */
    .item-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .badge.featured {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde68a;
    }
    .badge.best-match {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* Sidebar detected region note */
    .detected-region-note {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.75rem;
      padding: 0.6rem 0.75rem;
      background: #f3f4f6;
      border-radius: 0.5rem;
      line-height: 1.5;
    }
    .detected-region-note strong { color: #374151; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Integration Directory</h1>
      <p>Filterable partner and integration directory with region-based filtering, relevance scoring, and shareable filter states.</p>
      <div class="geo-pill">
        <span class="geo-dot"></span>
        Detected region: <strong id="geo-label">Detecting...</strong>
      </div>
    </div>
  </header>

  <main style="padding: 2rem 0;">
    <div id="directory-app" v-cloak>
      <div class="directory__grid container">
        <div class="directory__grid--wrapper">

          <!-- Sidebar Filters -->
          <div class="directory__grid--filter-container">

            <!-- Region Filters -->
            <div class="directory__grid--filters">
              <template v-if="anyRegions">
                <div class="directory__grid--filters-wrapper">
                  <h5>Region</h5>
                  <ul>
                    <li @click="toggleAllRegions"
                        :class="{ 'selected': selectedRegions.length === regions.length }"
                        role="checkbox"
                        :aria-checked="selectedRegions.length === regions.length ? 'true' : 'false'"
                        tabindex="0">
                      All
                    </li>
                    <li v-for="region in regions" :key="region.slug"
                        @click="toggleRegion(region.slug)"
                        @keydown.space.prevent="toggleRegion(region.slug)"
                        :class="{ 'selected': selectedRegions.includes(region.slug) }"
                        role="checkbox"
                        :aria-checked="selectedRegions.includes(region.slug) ? 'true' : 'false'"
                        tabindex="0">
                      {{ region.name }}
                    </li>
                  </ul>
                  <p class="detected-region-note">
                    <strong>{{ detectedRegion }}</strong> was detected from your browser locale and pre-selected. In production this uses GeoIP.
                  </p>
                </div>
              </template>
            </div>

            <!-- Category Filters -->
            <div class="directory__grid--filters">
              <template v-if="anyCategories">
                <div class="directory__grid--filters-wrapper">
                  <h5>Category</h5>
                  <ul>
                    <li @click="toggleAllCategories"
                        :class="{ 'selected': selectedCategories.length === categories.length }"
                        role="checkbox"
                        :aria-checked="selectedCategories.length === categories.length ? 'true' : 'false'"
                        tabindex="0">
                      All
                    </li>
                    <li v-for="category in categories" :key="category.slug"
                        :class="{ 'selected': selectedCategories.includes(category.slug) }"
                        @click="toggleCategory(category.slug)"
                        role="checkbox"
                        tabindex="0"
                        :aria-checked="selectedCategories.includes(category.slug) ? 'true' : 'false'">
                      {{ category.name }}
                    </li>
                  </ul>
                </div>
              </template>
            </div>
          </div>

          <!-- Grid Items -->
          <div style="flex: 1; min-width: 0;">

            <!-- Stats bar -->
            <div class="stats-bar">
              <span>
                Showing <strong>{{ filteredItems.length }}</strong> of <strong>{{ matchCount }}</strong> integrations
                <template v-if="filtersActive"> matching your filters</template>
              </span>
              <button class="share-btn" :class="{ copied }" @click="copyShareUrl">
                <svg v-if="!copied" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                <svg v-else xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                {{ copied ? 'Copied!' : 'Copy shareable link' }}
              </button>
            </div>

            <div class="directory__grid--items">

              <!-- Loading Skeleton -->
              <template v-if="isLoading">
                <div v-for="item in filteredItems" :key="item.id" class="loading directory__item">
                  <a class="directory__item--link">
                    <div class="directory__item--image"></div>
                    <h5 class="directory__item--title">Loading...</h5>
                    <p class="directory__item--desc">Placeholder text for loading state...</p>
                  </a>
                </div>
              </template>

              <!-- Active Items -->
              <template v-else-if="anyActive && !isLoading">
                <div v-for="(item, index) in filteredItems"
                     :key="item.id"
                     class="directory__item"
                     v-show="item.active">
                  <a :href="item.link"
                     target="_blank"
                     class="directory__item--link">
                    <div>
                      <div class="item-badges" style="margin-bottom: 0.75rem;">
                        <span v-if="item.priority === 1" class="badge featured">★ Featured</span>
                        <span v-if="filtersActive && index < 3 && item.score > 0" class="badge best-match">Best match</span>
                      </div>
                      <div class="directory__item--image">
                        <img v-if="item.thumbnail" :src="item.thumbnail" :alt="`Logo for ${item.title}`" />
                        <div v-else style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border-radius:0.5rem;color:#6b7280;font-size:2rem;font-weight:700;">
                          {{ item.title.charAt(0) }}
                        </div>
                      </div>
                    </div>
                    <h4 v-html="item.title"></h4>
                    <p v-html="item.excerpt"></p>
                  </a>
                </div>
                <div class="load-more">
                  <button v-if="hasMore"
                          @click="loadMore"
                          class="directory__grid--more btn outline">
                    Load More
                  </button>
                </div>
              </template>

              <!-- No Results -->
              <template v-else>
                <p style="display: block; padding: 2rem; text-align: center; color: #6b7280;">
                  No results matching the selected filters.
                </p>
              </template>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="directory-data.js"></script>
  <script src="directory-app.js"></script>
  <script>
    // Update the geo label in the static header once Vue has detected the region
    document.addEventListener('DOMContentLoaded', function () {
      const lang = (navigator.language || 'en-US').toLowerCase();
      let region = 'North America';
      if (/^(en-gb|en-ie|de|fr|es-es|it|nl|pl|sv|da|fi|nb|pt-pt)/.test(lang)) region = 'Europe';
      else if (/^(ja|zh|ko|en-au|en-nz|en-sg|id|th|vi)/.test(lang)) region = 'Asia Pacific';
      else if (/^(pt-br|es-ar|es-co|es-cl|es-pe)/.test(lang)) region = 'Latin America';
      const el = document.getElementById('geo-label');
      if (el) el.textContent = region;
    });
  </script>
</body>
</html>
